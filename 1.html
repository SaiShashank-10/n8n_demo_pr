<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up / Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a5acd, #00bcd4);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 440px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .tabs {
      display: flex;
      background: #f5f5f5;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 14px;
      cursor: pointer;
      font-weight: bold;
      color: #666;
      border: none;
      background: transparent;
      transition: all 0.3s ease;
    }
    .tab.active {
      background: white;
      color: #6a5acd;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .header h2 {
      margin: 0 0 6px;
      color: #2d2d2d;
    }
    .header p {
      margin: 0;
      font-size: 14px;
      color: #666;
    }
    .form-box {
      padding: 24px;
    }
    .form {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .form.active {
      display: block;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #6a5acd;
      box-shadow: 0 0 0 2px rgba(106, 90, 205, 0.15);
    }
    .password-wrap {
      position: relative;
    }
    .password-wrap input {
      padding-right: 70px;
    }
    .toggle-password {
      position: absolute;
      right: 8px;
      top: 8px;
      width: auto;
      padding: 6px 8px;
      background: transparent;
      color: #6a5acd;
      font-size: 12px;
      border: none;
      cursor: pointer;
    }
    .extra-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 13px;
      color: #666;
    }
    .checkbox {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .link {
      color: #6a5acd;
      text-decoration: none;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #6a5acd;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    button:hover { background: #5848b6; }
    .hint {
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
      color: #666;
    }
    .message {
      margin-bottom: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .message.success { background: #e8f8ee; color: #1f7a3a; display: block; }
    .message.error { background: #fdeaea; color: #b42318; display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="showForm('signup')">Sign Up</button>
      <button class="tab" onclick="showForm('login')">Login</button>
    </div>

    <div class="form-box">
      <div class="header">
        <h2 id="formTitle">Create Account</h2>
        <p id="formSubtitle">Join us and get started in seconds.</p>
      </div>

      <form class="form active" id="signupForm">
        <div class="message" id="signupMessage"></div>
        <label for="signupName">Full Name</label>
        <input id="signupName" type="text" placeholder="Enter your name" required />

        <label for="signupEmail">Email</label>
        <input id="signupEmail" type="email" placeholder="Enter your email" required />

        <label for="signupPassword">Password</label>
        <div class="password-wrap">
          <input id="signupPassword" type="password" placeholder="Create a password" required />
          <button type="button" class="toggle-password" onclick="togglePassword('signupPassword', this)">Show</button>
        </div>

        <button type="submit">Create Account</button>
        <div class="hint">Already have an account? Switch to Login.</div>
      </form>

      <form class="form" id="loginForm">
        <div class="message" id="loginMessage"></div>
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" placeholder="Enter your email" required />

        <label for="loginPassword">Password</label>
        <div class="password-wrap">
          <input id="loginPassword" type="password" placeholder="Enter your password" required />
          <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">Show</button>
        </div>

        <div class="extra-row">
          <label class="checkbox"><input type="checkbox" /> Remember me</label>
          <a href="#" class="link">Forgot password?</a>
        </div>

        <button type="submit">Login</button>
        <div class="hint">New here? Switch to Sign Up.</div>
      </form>
    </div>
  </div>

  <script>
    function showForm(type) {
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.form').forEach(form => form.classList.remove('active'));
      document.querySelectorAll('.message').forEach(msg => msg.className = 'message');

      const title = document.getElementById('formTitle');
      const subtitle = document.getElementById('formSubtitle');

      if (type === 'signup') {
        document.querySelector('.tab:nth-child(1)').classList.add('active');
        document.getElementById('signupForm').classList.add('active');
        title.textContent = 'Create Account';
        subtitle.textContent = 'Join us and get started in seconds.';
      } else {
        document.querySelector('.tab:nth-child(2)').classList.add('active');
        document.getElementById('loginForm').classList.add('active');
        title.textContent = 'Welcome Back';
        subtitle.textContent = 'Log in to continue to your account.';
      }
    }

    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      button.textContent = isPassword ? 'Hide' : 'Show';
    }

    document.getElementById('signupForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const message = document.getElementById('signupMessage');

      if (!name || !email || password.length < 4) {
        message.className = 'message error';
        message.textContent = 'Please enter a valid name, email, and password (min 4 chars).';
        return;
      }

      message.className = 'message success';
      message.textContent = `Account created for ${name}!`;
    });

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const message = document.getElementById('loginMessage');

      if (!email || password.length < 4) {
        message.className = 'message error';
        message.textContent = 'Please enter a valid email and password.';
        return;
      }

      message.className = 'message success';
      message.textContent = 'Login successful!';
    });
  </script>
</body>
</html>
